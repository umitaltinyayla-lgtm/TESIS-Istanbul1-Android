plugins {
    id 'com.android.application'
}

android {
    namespace 'tr.org.tesis.istanbulbir'
    compileSdk 35

    defaultConfig {
        applicationId 'tr.org.tesis.istanbulbir'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
