name: TES-IS Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Java 17 hazirla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle hazirla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Orijinal yuksek cozunurluklu TES-IS logosunu hazirla
        run: |
          set -euo pipefail
          LOGO_OUT="app/src/main/res/drawable/tes_is_gercek_logo.png"
          LOGO_URL="https://ist1tes-is.com.tr/wp-content/themes/tes-is-ist1-wordpress/assets/logo.png"
          curl --fail --show-error --silent --location --retry 3 --connect-timeout 15 --max-time 75 "$LOGO_URL" --output "$LOGO_OUT"
          file "$LOGO_OUT"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path("app/src/main/res/drawable/tes_is_gercek_logo.png")
          data = p.read_bytes()
          assert data[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10)), "Logo must be PNG"
          w,h = struct.unpack(">II", data[16:24])
          print(f"Verified original TES-IS logo: {w}x{h}, {len(data)} bytes")
          assert w >= 256 and h >= 256, "Low-resolution logo rejected"
          PY
      - name: APK derle
        run: gradle --no-daemon :app:assembleDebug
      - name: APK dogrula
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Kurulabilir APK'yi sakla
        uses: actions/upload-artifact@v4
        with:
          name: TESIS-Istanbul1-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Android emulatorde kur ve ac
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 1536M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 1536
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            adb install --no-streaming -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n tr.org.tesis.istanbulbir.uygulama/tr.org.tesis.istanbulbir.MainActivity
            sleep 6
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|tr.org.tesis.istanbulbir'
            adb logcat -d -t 1000 | grep -i 'FATAL EXCEPTION' && exit 1 || true
