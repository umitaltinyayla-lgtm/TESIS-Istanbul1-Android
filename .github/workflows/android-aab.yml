name: TESIS Android AAB (Test)
on:
  push:
    branches: [tes-is-v1.11-kurum-bildirim-test]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore original TES-IS logo
        run: |
          mkdir -p app/src/main/res/drawable
          curl --fail --location --retry 3 --silent --show-error 'https://ist1tes-is.com.tr/wp-content/themes/tes-is-ist1-wordpress/assets/logo.png' --output app/src/main/res/drawable/tes_is_gercek_logo.png
          file app/src/main/res/drawable/tes_is_gercek_logo.png
      - name: Build unsigned AAB
        run: gradle --no-daemon :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TESIS-TEST-UNSIGNED-AAB
          path: app/build/outputs/bundle/release/*.aab
